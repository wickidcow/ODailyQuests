name: Generate and Deploy Javadoc

on:
  push:
    branches:
      - master
      - 3.0.4
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/deploy-javadoc.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Generate Javadoc
        run: ./gradlew javadoc --no-daemon

      - name: Install SCP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client sshpass

      - name: Deploy Javadoc via SCP
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_TARGET_PATH: ${{ secrets.FTP_TARGET_PATH }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

          PORT="${FTP_PORT:-22}"

          sshpass -p "$FTP_PASSWORD" scp \
            -o StrictHostKeyChecking=no \
            -P "$PORT" \
            -r build/docs/javadoc/* \
            "$FTP_USERNAME@$FTP_HOST:$FTP_TARGET_PATH"
