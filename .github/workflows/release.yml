name: Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to release'
        required: true
        default: '3.0.4-Albion-Spigot-26.1.2'

permissions:
  contents: write

env:
  JAVA_VERSION: '25'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build stable jar
        run: ./gradlew clean shadowJar -x test --no-daemon
        env:
          ORG_GRADLE_PROJECT_version: ${{ github.event.inputs.version }}

      - name: Upload stable jar artifact
        uses: actions/upload-artifact@v6
        with:
          name: ODailyQuests-${{ github.event.inputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: ODailyQuests ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
