plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'maven-publish'
}

group = 'com.ordwen'
version = "3.0.8-Spigot-1.21.11+"

def ciVersion = System.getenv("ORG_GRADLE_PROJECT_version")
if (ciVersion != null && !ciVersion.trim().isEmpty()) {
    version = ciVersion.trim()
    println "Using CI-injected version: ${version}"
} else {
    println "Using local default version: ${version}"
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://oss.sonatype.org/content/groups/public/' }
    maven { url = 'https://repo.rosewooddev.io/repository/public/' }
    maven { url = 'https://repo.momirealms.net/releases/' }
    maven { url = 'https://maven.citizensnpcs.co/repo' }
    maven { url = 'https://mvn.lumine.io/repository/maven-public/' }
    maven { url = 'https://libraries.minecraft.net/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public/' }
    maven { url = 'https://repo.bg-software.com/repository/api/' }
    maven { url = 'https://mvn-repo.arim.space/lesser-gpl3/' }
    maven { url = 'https://nexus.phoenixdevt.fr/repository/maven-public/' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://repo.glaremasters.me/repository/towny/' }
    maven { url = 'https://repo.magmaguy.com/releases/' }
    maven { url = 'https://repo.nightexpressdev.com/releases/' }
    maven { url = 'https://repo.nexomc.com/releases/' }
    maven { url = 'https://repo.oraxen.com/releases' }
    maven { url = 'https://repo.auxilor.io/repository/maven-public/' }
    maven { url = 'https://repo.fancyinnovations.com/releases' }
    maven { url = 'https://repo.codemc.io/repository/EvenMoreFish/' }
    maven { url = 'https://maven.devs.beer/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    /* database management */
    compileOnly 'com.zaxxer:HikariCP:7.0.2'
    compileOnly 'org.xerial:sqlite-jdbc:3.53.0.0'
    compileOnly 'com.h2database:h2:2.4.240'

    /* Spigot */
    compileOnly 'org.spigotmc:spigot-api:1.21.11-R0.1-SNAPSHOT'

    /* Folia/Paper scheduling compatibility */
    implementation 'space.arim.morepaperlib:morepaperlib:0.4.3'

    /* lib for antiglitch */
    compileOnly 'com.jeff-media:custom-block-data:2.2.5'

    /* Mojang auth API for heads */
    compileOnly 'com.mojang:authlib:3.13.56'

    /* economy & points */
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'org.black_ixx:playerpoints:3.2.6'
    compileOnly('com.github.Realizedd:TokenManager:3.2.4') { transitive = false }

    /* npcs */
    compileOnly('net.citizensnpcs:citizens-main:2.0.42-SNAPSHOT') { exclude group: '*', module: '*' }
    compileOnly 'de.oliver:FancyNpcs:2.9.0'

    /* mobs */
    compileOnly 'io.lumine:Mythic-Dist:5.11.2'
    compileOnly 'com.magmaguy:EliteMobs:10.0.0-SNAPSHOT'

    /* stackers */
    compileOnly 'dev.rosewood:rosestacker:1.5.38'
    compileOnly 'com.bgsoftware:WildStackerAPI:2025.2'

    /* guis */
    compileOnly 'me.clip:placeholderapi:2.11.6'

    /* custom items */
    compileOnly 'io.th0rgal:oraxen:1.213.0'
    compileOnly 'dev.lone:api-itemsadder:4.0.10'
    compileOnly 'com.nexomc:nexo:1.16.1'
    compileOnly 'net.Indyuce:MMOItems-API:6.10.1-SNAPSHOT'
    compileOnly 'net.Indyuce:MMOCore-API:1.13.1-SNAPSHOT'
    compileOnly 'io.lumine:MythicLib-dist:1.7.1-SNAPSHOT'
    compileOnly 'net.momirealms:custom-crops:3.6.29'
    compileOnly 'net.momirealms:custom-fishing:2.3.4'
    compileOnly 'com.oheers.evenmorefish:even-more-fish-api:2.1.5'
    compileOnly('me.kryniowesegryderiusz:kgenerators-core:7.3') { exclude group: '*', module: '*' }

    /* auto restart */
    compileOnly 'com.github.N0RSKA:UltimateAutoRestartAPI:2023.12'

    /* protection */
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.7'
    compileOnly 'com.palmergames.bukkit.towny:towny:0.100.3.1'

    implementation platform("com.intellectualsites.bom:bom-newest:1.55")
    compileOnly "com.intellectualsites.plotsquared:plotsquared-core"
    compileOnly("com.intellectualsites.plotsquared:plotsquared-bukkit") {
        transitive = false
    }

    /* vote */
    compileOnly 'com.github.NuVotifier:NuVotifier:2.7.2'

    /* NightExpress hooks use reflection because current API artifacts are not public Maven dependencies. */

    /* compatibility libs */
    compileOnly 'com.willfp:eco:6.76.2'

    /* tests */
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def buildJavaVersion = 25
def bytecodeJavaVersion = 21

java {
    toolchain.languageVersion = JavaLanguageVersion.of(buildJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.release = bytecodeJavaVersion
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
    failFast = false
}

tasks.shadowJar {
    archiveClassifier.set("")
    archiveFileName.set("${project.name}-${project.version}.jar")
    relocate 'io.papermc.lib', 'com.ordwen.odailyquests.lib.paperlib'
    relocate 'space.arim.morepaperlib', 'com.ordwen.odailyquests.lib.morepaperlib'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.build {
    dependsOn shadowJar
}

tasks.jar {
    enabled = false
}

publishing {
    publications {
        shadow(MavenPublication) {
            from(components.shadow)
            version = project.version.replace("-local", "")
        }
    }
}
