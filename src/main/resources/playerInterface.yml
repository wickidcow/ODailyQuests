# ======================================================
# Here you can create your own player quests interface.
#
# Never delete a %variable% unless you know what you're doing.
# %achieved% is replaced by the number of completed quests.
# %totalQuests% is replaced by the number of quests currently assigned to the player.
# %drawIn% is replaced by the time remaining before the next quests draw.
# %progressPercent% is replaced by the quest completion percentage.
# ======================================================
player_interface:
  size: 45
  inventory_name: "#0057ff &l        Daily Quests"
  # disable the status of the quest if you want to handle it manually by placeholders
  disable_status: false
  # the 3 following lines will not be used if disable_status is set to true
  status: "&eStatus :"
  progress: "&b%progress%&3/&b%required% &7(&f%progressPercent%%&7)"
  achieved: "&bCOMPLETED"
  # if you want to glow the item when the quest is achieved
  glowing_if_achieved: true
  complete_get_type: "&eClick to complete this quest!"
  player_head:
    enabled: true
    slot: 5
    # material: "nexo:odailyquests_head" # if you want to use a custom head from an external plugin
    # item_model: "odailyquests:player_head" # if you want to use a custom item model
    item_name: '&b%player_name%'
    item_description:
      - '&3Status: '
      - ' &3&l| &7Completed quests: &b%achieved%&3/&b%totalQuests%'
      - ' &3&l| &7Total completed quests: &b%odailyquests_total%'
      - ' &3&l| &7New quests in: &b%drawIn%'

  # ========================================================
  # Available types : FILL, PLAYER_COMMAND, CONSOLE_COMMAND
  # Placeholders : %player%
  # More info on Wiki.
  #
  # Optional button dependency gate:
  # requires_any_plugin: [Jobs, JobsReborn]
  # The button is only loaded when at least one listed plugin is enabled.
  #
  # SLOTS STARTS AT 1!
  # ========================================================
  quests:
    # The maintained default is one quest from each loaded category.
    # Optional Tech/Wild Card categories are simply absent when no provider is available.
    categories:
      easy:
        - 12
      medium:
        - 14
      hard:
        - 16
      good:
        - 21
      tech:
        - 23
      evil:
        - 25
      wildcard:
        - 32
  items:
    0:
      type: CLOSE
      item:
        material: BARRIER
        name: "&cClose"
        lore: [ ]
        slot: 37
    1:
      type: PLAYER_COMMAND
      item:
        material: CUSTOM_HEAD
        name: '&b&lInformation'
        texture: cdcdee6d06df234b8e603328b96c57f3a312e79aabfc3be72a8b421878ed68cf
        lore:
          - ' &3&l| &7Everyday you get a new'
          - ' &3&l| &7set of quests.'
          - ''
          - ' &3&l| &7Completing quests will'
          - ' &3&l| &7give you money!'
          - ''
          - ' &8(&7!&8) &7Completing categories will'
          - '  &7 give you extra rewards too'
          - ''
        slot: 1
    2:
      type: PLAYER_COMMAND
      commands:
        - 'dq reroll'
      item:
        material: CUSTOM_HEAD
        name: "&b&lDaily Reroll"
        texture: bc8def67a12622ead1decd3d89364257b531896d87e469813131ca235b5c7
        lore:
          - ' &3&l| &7Reroll your daily quests.'
          - ''
          - ' &3&l| &7Choose to reroll one quest'
          - ' &3&l| &7or your entire daily set.'
          - ''
          - ' &8(&7!&8) &7Available once per day.'
          - ''
          - ' &bClick to choose'
        slot: 9
    3:
      type: FILL
      item:
        material: BLUE_STAINED_GLASS_PANE
        slot:
          - 2
          - 3
          - 4
          - 6
          - 7
          - 8
          - 10
          - 18
          - 19
          - 27
          - 28
          - 36
          - 38
          - 39
          - 40
          - 41
          - 42
          - 43
          - 44
          - 45
    4:
      type: FILL
      item:
        material: CYAN_STAINED_GLASS_PANE
        slot:
          - 11
          - 17
          - 20
          - 26
          - 29
          - 30
          - 34
          - 35
    5:
      type: PLAYER_COMMAND
      requires_any_plugin:
        - Jobs
        - JobsReborn
      commands:
        - 'jobs quests'
      item:
        material: WRITABLE_BOOK
        name: '&6&lJobs Quests'
        lore:
          - ' &6&l| &7Open your Jobs quests.'
          - ''
          - ' &eClick to open'
        slot: 45
