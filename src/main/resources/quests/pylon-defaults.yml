# Maintained exact-item Pylon/Rebar Tech defaults.
# These are merged additively into a managed tech.yml and are dependency-gated by pylon-rebar.
quests:
  __pylon_shimmer_magnet:
    name: '&#55FFFFDaily Tech: Shimmer Magnet'
    menu_item: COMPASS
    description:
      - ' &7Category: &fTech'
      - ''
      - '&3Task:'
      - ' &3&l| &7Craft a Shimmer Magnet'
      - ''
      - '&3Progress:'
      - ' &3&l| %status%'
      - ''
      - '&3Rewards:'
      - ' &3&l| &72200 Gold'
      - ' &3&l| &7900 XP'
      - ' &3&l| &73 Quest Points'
    quest_type: REBAR_ITEM
    required_amount: 1
    pylon_keys:
      - pylon:shimmer_magnet
    reward:
      reward_type: COMMAND
      commands:
        - eco give %player_name% 2200
        - xp give %player_name% 900
        - questadmin givepoints %player_name% 3
    default_pack: pylon-rebar
    weight: 1.0

